[project]
name="enterprise-agentic-rag"
version="0.1.0"
description = "Production-oriented Agentic RAG and Knowledge Intelligence Platform"
requires-python=">=3.10,<3.11"

dependencies = [
    "pymupdf",
    "sentence-transformers",
    "numpy",
    "python-dotenv",
    "langchain-text-splitters",
    "mlflow",
    "openai"
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff"
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I"
]